<svg viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="55%" stop-color="#122238"/>
      <stop offset="100%" stop-color="#1b3350"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4dff88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4dff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#sky2)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <rect x="80" y="30" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="260" y="60" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="440" y="25" width="4" height="4"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="700" y="45" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="900" y="20" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="1100" y="55" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="1300" y="35" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="1480" y="65" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- slow-drifting pixel clouds -->
  <g fill="#3a5a78" opacity="0.5">
    <g>
      <rect x="0" y="70" width="60" height="14"/><rect x="14" y="58" width="32" height="14"/>
      <animateTransform attributeName="transform" type="translate" values="-100,0; 1700,0" dur="40s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="100" width="80" height="16"/><rect x="18" y="86" width="40" height="16"/>
      <animateTransform attributeName="transform" type="translate" values="-120,0; 1720,0" dur="55s" begin="-15s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="0" y="45" width="50" height="12"/><rect x="10" y="35" width="26" height="12"/>
      <animateTransform attributeName="transform" type="translate" values="-80,0; 1680,0" dur="32s" begin="-8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="350" width="1600" height="50" fill="#2a1e14"/>
  <rect x="0" y="350" width="1600" height="10" fill="#4a7c3a"/>

  <!-- floating platforms -->
  <g fill="#3a4a5c">
    <rect x="140" y="260" width="140" height="16"/>
    <rect x="420" y="240" width="140" height="16"/>
    <rect x="700" y="255" width="140" height="16"/>
    <rect x="980" y="235" width="140" height="16"/>
    <rect x="1260" y="255" width="140" height="16"/>
  </g>

  <!-- floating platform gentle bob (applied via wrapping groups below per icon) -->

  <!-- LINUX (generic penguin-silhouette block, subtle glow) -->
  <g transform="translate(160,150)">
    <circle cx="50" cy="70" r="55" fill="url(#glow)">
      <animate attributeName="r" values="50;62;50" dur="3s" repeatCount="indefinite"/>
    </circle>
    <rect x="30" y="30" width="40" height="50" fill="#e8e8e8"/>
    <rect x="20" y="80" width="60" height="30" fill="#2c2c2c"/>
    <rect x="40" y="45" width="8" height="8" fill="#111"/>
    <rect x="55" y="45" width="8" height="8" fill="#111"/>
    <text x="50" y="135" fill="#cfd8dc" font-size="15" text-anchor="middle">LINUX</text>
    <animateTransform attributeName="transform" type="translate" values="160,150; 160,142; 160,150" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- DOCKER (generic container box, floats) -->
  <g transform="translate(440,130)">
    <rect x="0" y="20" width="110" height="46" fill="#2496ed"/>
    <rect x="0" y="8" width="26" height="18" fill="#2496ed"/>
    <rect x="32" y="8" width="26" height="18" fill="#2496ed"/>
    <rect x="64" y="8" width="26" height="18" fill="#2496ed"/>
    <rect x="8" y="30" width="10" height="10" fill="#0a1220"/>
    <rect x="26" y="30" width="10" height="10" fill="#0a1220"/>
    <rect x="44" y="30" width="10" height="10" fill="#0a1220"/>
    <rect x="62" y="30" width="10" height="10" fill="#0a1220"/>
    <rect x="80" y="30" width="10" height="10" fill="#0a1220"/>
    <text x="55" y="90" fill="#9fd3ff" font-size="15" text-anchor="middle">DOCKER</text>
    <animateTransform attributeName="transform" type="translate" values="440,130; 440,120; 440,130" dur="3.4s" repeatCount="indefinite"/>
  </g>

  <!-- KUBERNETES (generic voxel helm wheel, rotates) -->
  <g transform="translate(730,120)">
    <g>
      <rect x="30" y="0" width="20" height="20" fill="#4d94ff"/>
      <rect x="0" y="20" width="20" height="20" fill="#4d94ff"/>
      <rect x="60" y="20" width="20" height="20" fill="#4d94ff"/>
      <rect x="30" y="60" width="20" height="20" fill="#4d94ff"/>
      <rect x="0" y="40" width="20" height="20" fill="#4d94ff"/>
      <rect x="60" y="40" width="20" height="20" fill="#4d94ff"/>
      <rect x="30" y="30" width="20" height="20" fill="#0a1220"/>
      <animateTransform attributeName="transform" type="rotate" values="0 40 40; 360 40 40" dur="10s" repeatCount="indefinite"/>
    </g>
    <text x="40" y="98" fill="#9fd3ff" font-size="15" text-anchor="middle">KUBERNETES</text>
  </g>

  <!-- TERRAFORM (generic purple voxel stack, subtle rotation) -->
  <g transform="translate(1010,130)">
    <g>
      <rect x="0" y="30" width="26" height="26" fill="#7b42bc"/>
      <rect x="30" y="30" width="26" height="26" fill="#7b42bc"/>
      <rect x="15" y="0" width="26" height="26" fill="#9b6fd6"/>
      <rect x="15" y="60" width="26" height="26" fill="#5c2f96"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 28 43; 6 28 43; -6 28 43" dur="4s" repeatCount="indefinite"/>
    </g>
    <text x="28" y="105" fill="#c9a8f0" font-size="15" text-anchor="middle">TERRAFORM</text>
  </g>

  <!-- ANSIBLE (generic red voxel gear/circle, subtle rotation) -->
  <g transform="translate(1290,135)">
    <g>
      <circle cx="35" cy="35" r="32" fill="#e10098" opacity="0.85"/>
      <rect x="27" y="3" width="16" height="14" fill="#e10098"/>
      <rect x="27" y="53" width="16" height="14" fill="#e10098"/>
      <rect x="3" y="27" width="14" height="16" fill="#e10098"/>
      <rect x="53" y="27" width="14" height="16" fill="#e10098"/>
      <circle cx="35" cy="35" r="14" fill="#0a1220"/>
      <animateTransform attributeName="transform" type="rotate" values="0 35 35; -360 35 35" dur="12s" repeatCount="indefinite"/>
    </g>
    <text x="35" y="98" fill="#ff9fd6" font-size="15" text-anchor="middle">ANSIBLE</text>
  </g>

  <!-- GITHUB ACTIONS (generic pipeline nodes with animated flow) -->
  <g transform="translate(1150,250)">
    <line x1="0" y1="10" x2="140" y2="10" stroke="#4dff88" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="10" r="7" fill="#24292e" stroke="#4dff88" stroke-width="2"/>
    <circle cx="70" cy="10" r="7" fill="#24292e" stroke="#4dff88" stroke-width="2"/>
    <circle cx="140" cy="10" r="7" fill="#24292e" stroke="#4dff88" stroke-width="2"/>
    <circle cx="0" cy="10" r="4" fill="#4dff88">
      <animate attributeName="cx" values="0;70;140;140" keyTimes="0;0.45;0.9;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.45;0.9;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="40" fill="#9fd3ff" font-size="14" text-anchor="middle">GITHUB ACTIONS</text>
  </g>

  <!-- rising particles -->
  <g fill="#4dff88">
    <circle cx="230" cy="330" r="2.5"><animate attributeName="cy" values="330;40;330" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="330" r="2.5"><animate attributeName="cy" values="330;40;330" dur="7s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="330" r="2.5"><animate attributeName="cy" values="330;40;330" dur="5.5s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="330" r="2.5"><animate attributeName="cy" values="330;40;330" dur="6.5s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="330" r="2.5"><animate attributeName="cy" values="330;40;330" dur="5.8s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.8s" begin="-4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="800" y="55" fill="#ffffff" font-size="36" font-weight="bold" text-anchor="middle" letter-spacing="2">MALIK MUHAMMAD AHAD</text>
  <text x="800" y="90" fill="#9fd3ff" font-size="18" text-anchor="middle" letter-spacing="1">DEVOPS ENGINEER (IN TRAINING) · LINUX · DOCKER · KUBERNETES · TERRAFORM · ANSIBLE · CI/CD</text>
</svg>
